name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # --check so CI fails rather than reformatting; the pre-commit hook is
      # what writes the fixes locally.
      - name: Format check
        run: ruff format --check .

      - name: Test with coverage
        run: |
          pytest \
            --cov=db2_flattener \
            --cov-branch \
            --cov-report=lcov:coverage-py${{ matrix.python-version }}.lcov \
            --cov-report=term

      - name: Upload coverage to Coveralls (parallel)
        uses: coverallsapp/github-action@v2
        with:
          file: coverage-py${{ matrix.python-version }}.lcov
          format: lcov
          flag-name: py${{ matrix.python-version }}
          parallel: true

  coveralls-finish:
    name: Finalize Coveralls
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "py3.10,py3.11,py3.12"
