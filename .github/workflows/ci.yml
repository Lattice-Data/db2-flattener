name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and newest, not every version in between. This is a
        # zero-dependency pure-Python library, so the versions between the two
        # ends have nothing to break that the ends would not also catch. These
        # two are the exact ends of the range requires-python declares in
        # pyproject.toml (">=3.10,<3.15") -- raise them together or the package
        # starts claiming a version nothing tests.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # --check so CI fails rather than reformatting; the pre-commit hook is
      # what writes the fixes locally.
      - name: Format check
        run: ruff format --check .

      - name: Test with coverage
        run: |
          pytest \
            --cov=db2_flattener \
            --cov-branch \
            --cov-report=lcov \
            --cov-report=term

      # Uploaded from one interpreter only. Coverage is a property of the suite,
      # not of the Python version, so one upload per matrix leg would buy no
      # extra signal and would mean coordinating Coveralls' parallel-build
      # protocol to merge them back into a single number. Authenticates with the
      # built-in GITHUB_TOKEN -- no external secret.
      #
      # Pinned to the floor rather than the newest leg so that raising the top of
      # the matrix does not silently move which job reports coverage.
      #
      # fail-on-error: the reporter downloads a binary at run time, and that
      # download does fail from time to time. Coverage reporting going down is
      # not a reason to call a passing test suite broken.
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.10'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
          fail-on-error: false
