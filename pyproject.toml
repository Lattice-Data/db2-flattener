[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db2-flattener"
version = "0.0.1"
description = "Flattener utilities for DB2."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lattice Data Coordination" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Lattice-Data/db2-flattener"
Issues = "https://github.com/Lattice-Data/db2-flattener/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/db2_flattener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["db2_flattener"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
