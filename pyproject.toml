[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db2-flattener"
version = "0.0.1"
description = "Flattener utilities for DB2."
readme = "README.md"
license = { file = "LICENSE" }
# Bounded at both ends so the declared range is exactly the range CI tests: the
# floor and the ceiling are the two legs of the matrix in .github/workflows/ci.yml.
# When 3.15 ships, raise the ceiling and the matrix together.
requires-python = ">=3.10,<3.15"
authors = [{ name = "Lattice Data Coordination" }]
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "requests",
  "s3fs",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  # Pinned, not a floor: `lint.select` below names rule *families*, so a ruff
  # release that adds rules to one silently changes what CI enforces. Keep in
  # sync with the ruff pin in .pre-commit-config.yaml.
  "ruff==0.16.5",
]

[project.urls]
Homepage = "https://github.com/Lattice-Data/db2-flattener"
Issues = "https://github.com/Lattice-Data/db2-flattener/issues"

[project.scripts]
db2-flattener = "db2_flattener.cli:main"
db2-flattener-generate-constants = "db2_flattener.schema.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/db2_flattener"]

[tool.hatch.build.targets.wheel.force-include]
"src/db2_flattener/schema/data/constants.yaml" = "db2_flattener/schema/data/constants.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["db2_flattener"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Ported modules still have long lines from lattice-tools; wrap them in a
# follow-up rather than mixing a reformat into this move.
[tool.ruff.lint.per-file-ignores]
"src/db2_flattener/flatten/**" = ["E501", "SIM103"]
"src/db2_flattener/gather/**" = ["E501", "SIM108"]
"src/db2_flattener/schema/**" = ["E501"]
"src/db2_flattener/utils.py" = ["E501"]
"tests/**" = ["E501"]
